# Wuxing Skills — Data-driven tuning config (CORE_ISSUES.md Item 9)
#
# Format: key = value  (one per line, '#' starts a comment, blank lines ok)
# Only floats are supported. A key not listed here keeps whatever value the
# registering code set as its default — you don't need to list every
# tunable, only the ones you're actively iterating on.
#
# Edited while the game is running: core/tuning.c polls this file's mtime
# once per frame and re-applies changed values in place — no rebuild, no
# restart. Desktop-only by design (not copied for hot-reload on Android;
# see CORE_ISSUES.md Item 9).

# core_test — Item 8 EffectMaterial verification sphere
core_test_material_rim_strength = 1.5
core_test_material_fresnel_power = 4.0

# Đợt E / F1 — lit CPU particles (core/docs/ELDEN_VFX_SPEC.md).
# strength: 0 = legacy unlit look, 1 = fully lit. Needs GfxQuality >= MED.
# scatter:  backlit glow. THE acceptance test for F1 — put a puff between the
#           camera and a bright light; at a good value it visibly glows through.
particle_lighting_strength = 1.0
# 0=tắt  1=normal màn hình  2=CHỈ ánh sáng, quad đục  3=vector đèn L
# Mode 2 là mode phân định: bỏ cả màu texture lẫn alpha, nên sáng-giữa ở
# mode này KHÔNG THỂ do alpha chồng. Mỗi sprite thành ô vuông cứng, phải
# thấy rõ một bên sáng một bên tối.
# Mode 3 kiểm tra uniform có tới shader không — quét azimuth mà màu không
# đổi thì tunable không tới nơi, mọi quan sát khác đều vô nghĩa.
particle_debug_normal = 0.0
# Độ phồng của vòm normal. 1 = bán cầu thật. Tăng lên 1.5-2.5 nếu muốn
# đổ bóng gắt hơn mức vật lý (khói stylized thường cần).
# Ánh sáng phải TẠO HÌNH cho khói chứ không dìm nó. Ban đêm sun/ambient đều
# ~0.2 nên toán "đúng vật lý" sẽ nhân khói xuống còn 1/3. sun_gain kéo mặt
# sáng lên gần 1.0; ambient_gain GIẢM thì tương phản TĂNG (ambient là nền
# phẳng, chính nó làm bẹt khối). Muốn gắt: sun 3.0 / ambient 0.4.

# Chẩn đoán F1: hạ count xuống ~0.1 (còn 2-3 sprite) và tăng size lên 2-3.
# Một sprite đơn PHẢI thấy rõ sáng một bên. Thấy rõ = F1 đúng, cụm bị hoà tan.
# Không thấy = F1 còn lỗi.
smokepuff_size_mul    = 3.0
# Quét 0 -> 90 -> 180 -> 270: mặt sáng PHẢI chạy vòng quanh sprite.
# Nếu đốm sáng đứng yên ở giữa thì đổ bóng đang đối xứng xuyên tâm.
particle_light_azimuth = 180

particle_scatter_strength = 0.0
particle_sun_gain         = 1.0
particle_ambient_gain     = 0.25
particle_normal_bulge     = 1.0