# Wuxing Skills — Data-driven tuning config (CORE_ISSUES.md Item 9)
#
# Format: key = value  (one per line, '#' starts a comment, blank lines ok)
# Only floats are supported. A key not listed here keeps whatever value the
# registering code set as its default — you don't need to list every
# tunable, only the ones you're actively iterating on.
#
# Edited while the game is running: core/tuning.c polls this file's mtime
# once per frame and re-applies changed values in place — no rebuild, no
# restart. Desktop-only by design (not copied for hot-reload on Android;
# see CORE_ISSUES.md Item 9).

# core_test — Item 8 EffectMaterial verification sphere
core_test_material_rim_strength = 1.5
core_test_material_fresnel_power = 4.0

# Đợt E / F1 — lit CPU particles (core/docs/ELDEN_VFX_SPEC.md).
# strength: 0 = legacy unlit look, 1 = fully lit. Needs GfxQuality >= MED.
# scatter:  backlit glow. THE acceptance test for F1 — put a puff between the
#           camera and a bright light; at a good value it visibly glows through.
particle_lighting_strength = 1.0
# 0=tắt  1=normal màn hình  2=CHỈ ánh sáng, quad đục  3=vector đèn L
# Mode 2 là mode phân định: bỏ cả màu texture lẫn alpha, nên sáng-giữa ở
# mode này KHÔNG THỂ do alpha chồng. Mỗi sprite thành ô vuông cứng, phải
# thấy rõ một bên sáng một bên tối.
# Mode 3 kiểm tra uniform có tới shader không — quét azimuth mà màu không
# đổi thì tunable không tới nơi, mọi quan sát khác đều vô nghĩa.
particle_debug_normal = 0.0
# Độ phồng của vòm normal. 1 = bán cầu thật. Tăng lên 1.5-2.5 nếu muốn
# đổ bóng gắt hơn mức vật lý (khói stylized thường cần).
# Ánh sáng phải TẠO HÌNH cho khói chứ không dìm nó. Ban đêm sun/ambient đều
# ~0.2 nên toán "đúng vật lý" sẽ nhân khói xuống còn 1/3. sun_gain kéo mặt
# sáng lên gần 1.0; ambient_gain GIẢM thì tương phản TĂNG (ambient là nền
# phẳng, chính nó làm bẹt khối). Muốn gắt: sun 3.0 / ambient 0.4.

# Chẩn đoán F1: hạ count xuống ~0.1 (còn 2-3 sprite) và tăng size lên 2-3.
# Một sprite đơn PHẢI thấy rõ sáng một bên. Thấy rõ = F1 đúng, cụm bị hoà tan.
# Không thấy = F1 còn lỗi.
# Quét 0 -> 90 -> 180 -> 270: mặt sáng PHẢI chạy vòng quanh sprite.
# Nếu đốm sáng đứng yên ở giữa thì đổ bóng đang đối xứng xuyên tâm.
particle_light_azimuth = 180

particle_scatter_strength = 0.0
particle_sun_gain         = 1.0
particle_ambient_gain     = 0.25
particle_normal_bulge     = 1.0
# Khói: alpha THẤP là cố ý — khói là nhiều lớp mờ chồng nhau, một sprite đơn
# gần như không nhìn thấy. Tăng lên là quay về các cục tem dán rời rạc.

smokepuff_alpha    = 0.28
smokepuff_size_var = 1.4
smokepuff_count_mul = 1.4
# Lửa. rise_mul: 1 m lửa mà hạt bay 1-2 m trong đời nó thì ra đèn khò, không ra
# lửa — tàn bay vượt cả ngọn lửa sinh ra nó. Mức dâng hợp lý là 0.3-0.5 m.
flame_rise_mul = 1.0
# Bề rộng đế. Lửa cao = đế HẸP; nới rộng là ra quả cầu lửa.
flame_width_mul = 1.0
flame_core_alpha = 0.55
flame_smoke_amount = 1.0

# Cường độ đèn VFX hắt lên nền/nhân vật. Đóng góp "đúng vật lý" của một đèn
# lửa 4m chỉ khoảng 5% độ sáng bề mặt — rõ ban đêm, vô hình giữa ban ngày.
# Gain là thứ cho một đèn đọc được ở cả hai. Ban ngày cần 4-6.
vfx_light_gain = 3.0

# 1 = vẽ mỗi đèn VFX thành quả cầu khung dây tại vị trí thật, kèm gạch nối
# xuống mặt đất. Dùng để phân biệt "đèn sai chỗ" với "bề mặt tưởng mình sai chỗ"
# — hai thứ cho ra cùng một triệu chứng: không có gì sáng.
vfx_light_debug = 0

# 0=tắt  1=vẽ fract(worldPos) — lưới màu 1m nếu toạ độ đúng, MỘT MÀU PHẲNG nếu
#                              bề mặt sập về một điểm (matModel không tới nơi)
# 2=vẽ suy giảm của đèn 0 — phải thấy đĩa sáng ngay dưới hiệu ứng
vfx_light_debug_mode = 0

# Đợt E / E2 — controllable test light parked at the player (VFXLight_DebugTestLight)
vfx_light_test = 0
vfx_light_test_radius = 6.0

# ── F4 character aura (VFX_ComposeCharacterAura) ─────────────────────────────
# Layer strengths. The embers are the layer that actually reads as an aura
# (they break the silhouette); the wisps are the soft body flow that replaced
# the old fresnel shell. All are x-multipliers on the built-in defaults.
aura_ember_size = 1.0
aura_ember_rate = 1.0
aura_wisp_alpha = 1.0
aura_wisp_rate  = 1.0

# ── Đợt E1 post-FX (0 = off, the shipping default) ───────────────────────────
# postfx_streak       > 0 forces anamorphic streak bloom on; value = strength 0..1
# postfx_streak_angle radians, 0 = horizontal (classic anamorphic)
# postfx_radial       > 0 forces a constant screen-centre radial blur; ~0.15 strong.
#                     (Gameplay bursts use PostFX_RadialBurst and decay on their own.)
postfx_streak = 0.0
postfx_streak_angle = 0.0
postfx_radial = 0.0
smokepuff_flipbook = 1.0
smokepuff_fb_spin = 0.12
smokepuff_fb_count = 0.55
particle_fb_blend = 1.0
smokepuff_fb_size = 1.45
smokepuff_fb_frames = 50

# E5.1 glint sparkle
glint_rate = 1.0
glint_size = 1.0
glint_points = 14
particle_emissive_boost = 1.0
# NOTE: this was written as `impact_light 0`, with no '=', so the parser
# skipped it and it never took effect. Uncomment to actually apply it.
# impact_light = 0

# ── Ribbon trail (core/composition/common/vc_ribbon_trail.inl) ───────────────
# Registered lazily on the first VFX_ComposeRibbonTrail call.
# After that, edit and save this file and the change lands on the next frame.

# 1 = hold the ribbon's SHAPE completely still and let only the flow move.
# The one instrument that settles "is the energy actually flowing": a moving
# shape with a moving texture and a moving shape with a painted-on one look
# identical. Waits for a full ribbon before it holds, so set it any time.
swept_freeze = 0.0

# Flow rate over the cloth, x2.10 tiles/sec. NEGATIVE reverses the direction.
swept_flow = 1.0

# Metres of ribbon per repeat of the sheet. Larger = longer, sparser strands
# (more drift); smaller = denser, more urgent.
swept_tile = 0.5

# 0 = procedural finite streaks (neutral default), 1 = legacy energy_flow.png.
# The old asset is ornamental and should only be opted into for a specific look.
swept_sheet = 0

swept_width = 1.0
swept_aspect = 1.0
swept_spread = 2.2
swept_spark = 1.0
# x on the WHOLE trail's opacity. The three layers are additive and overlap,
# so their sum is what saturates: at 1.0 the body peaks just under full white.
# Drop this first if it still burns out.
swept_alpha = 1.5
swept_sag = 1.0
# x on the white-hot head. This is the layer that clips first.
swept_corehot = 1.0

# ── Volumetric tube (VFX_ComposeVolumeTrail) ─────────────────────────────────
# Registered lazily on the first volume trail.
# 1. Geometry movement
vol_static = 0     # follower moves
# vol_static = 1    # fixed diagnostic tube

# 2. Sheet UV scrolling / tube-noise travel
vol_flow = 0.0
# set 0 to stop scroll only

# 3. Flow-map distortion
vol_map_speed = 9.5
vol_map_strength = 0.20
vol_map_tiling = 2.0


smoketrail_curl_strength = 0.35
smoketrail_scroll_speed = 0.16
smoketrail_flow_speed = 0.4
smoketrail_flow_strength = 0.2
smoketrail_dissolve = 0.1
smoketrail_mask_tiling = 1.35


proj_spiral_r = 0.4      # bán kính xoắn thấy được (phần phía sau)
proj_spiral_head_r = 0.2  # emitter quay thật, luôn nằm trong lõi sáng
postfx_emissive_chroma = 1.0

strandtrail_style = 1.0
# ── Cột khói (VFX_ComposeSmokeColumn) ───────────────────────────────────────
# Cột có ĐÚNG hai chuyển động và chúng dính chung một đồng hồ, nên nhìn không
# tách được cái nào gây ra cái gì. Đặt freeze = 1 để đóng băng RIÊNG lưới:
# hình dạng giữ nguyên, chỉ sheet còn trượt.
#   vẫn thấy xoáy  -> thủ phạm là texture
#   hết xoáy       -> thủ phạm là biến dạng lưới
# Sửa file này lúc game đang chạy là ăn ngay, không cần build lại.
smokecolumn_freeze = 0.0
smokecolumn_noise = 2.0
smokecolumn_scroll = 1.5
smokecolumn_alpha = 1.0
smokecolumn_tile = 3.0


# Kính hiển vi cho ống khối — core/trails/shaders/trail_volume.fs
#   0 = tắt   1 = số hạng độ dày `edge`   2 = |N.V| thô
#   3 = tích hai sheet `pattern`          4 = mặt nạ dọc (vertex alpha)
#   7 = |fragPosition|/40 — xám đậm = world space (ĐÚNG), gần trắng = view space
#   5 = length(fragNormal): TRẮNG = thuộc tính pháp tuyến tới nơi, ĐEN = không
#   6 = độ dài pháp tuyến đạo hàm x8: ĐEN = tam giác suy biến, cross() sụp
#   7 = |fragPosition|/40 — phân biệt KHÔNG GIAN THẾ GIỚI hay KHÔNG GIAN NHÌN
volume_debug = 0
# 2.0 = ĐÚNG BẰNG smokecolumn_noise ở trên, 05/08/2026. Đây mới là mốc so
# sánh thật: cả buổi trước chạy ở 3.0 mà không ai biết (mọi vòng "vẫn phẳng"
# đều đo ở 3x), còn 1.0 — mặc định trong code — lại là MỘT NỬA biên độ mà cột
# khói người dùng đang ưng thật sự chạy. "Bản sao nguyên văn của cột" chỉ
# đúng khi hệ số nhân sống cũng bằng nhau.
# Muốn quét biên độ thì sửa ở đây, nhưng phải NÓI RA giá trị đang chạy khi báo
# cáo — dòng log VFX_SMOKE_TRAIL in ra `churn` ĐÃ nhân sẵn, đối chiếu với 0.34
# (mặc định SMOKE) để biết hệ số thật: churn 0.68 = 2.0x, churn 1.02 = 3.0x.
smoketrail2_noise = 2.0
# smoketrail2_bend / smoketrail2_freeze: KHÔNG có Tuning_RegisterFloat nào cho
# hai key này nữa (đã kiểm bằng grep) — code đăng ký chúng đã bị xoá, file này
# thì chưa dọn theo. Chúng hoàn toàn trơ; giữ lại chỉ để dòng này giải thích
# tại sao chúng biến mất, đừng thêm lại và đừng tưởng chúng còn tác dụng.